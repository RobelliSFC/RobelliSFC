<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06122f">
<title>Letture Immersioni</title>
<style>
:root{
  --bg:#06122f;
  --bg-2:#0a1d4a;
  --panel:#0e2557;
  --panel-line:rgba(160,196,255,.16);
  --ink:#f3f7ff;
  --ink-dim:#9db4e0;
  --blue:#1f6fe0;
  --blue-deep:#0b3d99;
  --sky:#62b4ff;
  --water:#0d4fb8;
  --ok:#5fd4a3;
  --warn:#ffc46b;
  --ease:cubic-bezier(.23,1,.32,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
html,body{margin:0}
body{
  min-height:100dvh;
  background:radial-gradient(120% 50% at 50% 0,var(--bg-2),var(--bg) 70%) no-repeat,var(--bg);
  color:var(--ink);
  font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding:max(16px,env(safe-area-inset-top)) 16px max(32px,env(safe-area-inset-bottom));
}
main{max-width:460px;margin:0 auto;display:grid;gap:16px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding:4px 2px}
h1{margin:0;font-size:1.25rem;font-weight:650;letter-spacing:-.01em}
.sub{margin:2px 0 0;color:var(--ink-dim);font-size:.8125rem}
.progress{font-variant-numeric:tabular-nums;color:var(--sky);font-weight:600;font-size:.875rem;white-space:nowrap}

.card{
  background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.02)),var(--panel);
  border:1px solid var(--panel-line);border-radius:20px;padding:16px;
}
.card h2{margin:0 0 12px;font-size:.75rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-dim)}

/* ---- waterplane ---- */
.plan{position:relative;width:100%;aspect-ratio:300/360}
.plan svg{position:absolute;inset:0;width:100%;height:100%}
.hull-fill{fill:url(#water)}
.hull-line{fill:none;stroke:#eaf3ff;stroke-width:2.2;stroke-linejoin:round}
.cl{stroke:var(--sky);stroke-opacity:.45;stroke-width:1;stroke-dasharray:8 4 2 4}
.station{stroke:var(--sky);stroke-opacity:.22;stroke-width:1;stroke-dasharray:3 4}
.lead{stroke:var(--sky);stroke-opacity:.55;stroke-width:1}
.dot{fill:#fff;stroke:var(--blue);stroke-width:2.5}
.lbl{fill:var(--ink-dim);font-size:10px;letter-spacing:.1em;text-transform:uppercase}
.lbl-c{text-anchor:middle}

.field{position:absolute;width:26.5%;transform:translateY(-50%)}
.field label{display:block;font-size:.6875rem;color:var(--ink-dim);margin:0 0 3px 2px;letter-spacing:.04em}
.field input{
  width:100%;height:46px;padding:0 6px;text-align:center;
  font:600 1.0625rem/1 ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums;
  color:var(--ink);background:rgba(3,10,30,.55);
  border:1px solid var(--panel-line);border-radius:12px;outline:none;
  transition:border-color .15s var(--ease),box-shadow .15s var(--ease),background-color .15s var(--ease);
}
.field input::placeholder{color:rgba(157,180,224,.4)}
.field input:focus{border-color:var(--sky);box-shadow:0 0 0 3px rgba(98,180,255,.25);background:rgba(3,10,30,.8)}
.field.done input{border-color:rgba(95,212,163,.55)}
.field time{display:block;min-height:1em;margin:3px 0 0 2px;font-size:.625rem;color:var(--ok);opacity:0;transform:translateY(-2px);transition:opacity .2s var(--ease),transform .2s var(--ease)}
.field.done time{opacity:.9;transform:none}
/* posizioni: x in %, y in % del piano */
.f-fp{left:0;top:25%}.f-fs{right:0;top:25%}
.f-mp{left:0;top:51%}.f-ms{right:0;top:51%}
.f-ap{left:0;top:79%}.f-as{right:0;top:79%}

/* ---- densità + dati nave ---- */
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.num{display:grid;gap:4px}
.num span{font-size:.75rem;color:var(--ink-dim)}
.num input{
  height:46px;padding:0 12px;font:600 1rem ui-monospace,Menlo,monospace;color:var(--ink);
  background:rgba(3,10,30,.55);border:1px solid var(--panel-line);border-radius:12px;outline:none;
  transition:border-color .15s var(--ease),box-shadow .15s var(--ease);
}
.num input:focus{border-color:var(--sky);box-shadow:0 0 0 3px rgba(98,180,255,.25)}
.num.full{grid-column:1/-1}
details summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;min-height:44px;font-size:.875rem;color:var(--ink-dim)}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"+";font-size:1.25rem;transition:transform .2s var(--ease)}
details[open] summary::after{transform:rotate(45deg)}
details .row{padding-top:8px}
.hint{grid-column:1/-1;margin:0;font-size:.75rem;color:var(--ink-dim)}

/* ---- riferimento marca poppa ---- */
.f-ref{position:absolute;left:34.5%;width:31%;top:79%;transform:translateY(-50%);z-index:1}
.f-ref label{display:block;font-size:.6875rem;color:var(--ink-dim);margin:0 0 3px;text-align:center;letter-spacing:.04em}
.f-ref select{
  appearance:none;-webkit-appearance:none;width:100%;height:46px;padding:0 4px;text-align:center;text-align-last:center;
  font:600 .875rem system-ui,sans-serif;color:var(--ink);background:rgb(6,18,47);
  border:1px solid var(--panel-line);border-radius:12px;outline:none;
  transition:border-color .15s var(--ease),box-shadow .15s var(--ease);
}
.f-ref select:focus{border-color:var(--sky);box-shadow:0 0 0 3px rgba(98,180,255,.25)}
.f-ref.done select{border-color:rgba(95,212,163,.55)}

/* ---- costruzione ---- */
.ship{display:grid;gap:6px}
.ship span{font-size:.75rem;color:var(--ink-dim);letter-spacing:.04em}
.select{position:relative}
.select::after{content:"";position:absolute;right:16px;top:50%;width:8px;height:8px;margin-top:-6px;border:solid var(--sky);border-width:0 2px 2px 0;transform:rotate(45deg);pointer-events:none}
.select select{
  appearance:none;-webkit-appearance:none;width:100%;height:52px;padding:0 40px 0 14px;
  font:600 1.125rem ui-monospace,Menlo,monospace;color:var(--ink);
  background:rgba(3,10,30,.55);border:1px solid var(--panel-line);border-radius:12px;outline:none;
  transition:border-color .15s var(--ease),box-shadow .15s var(--ease);
}
.select select:focus{border-color:var(--sky);box-shadow:0 0 0 3px rgba(98,180,255,.25)}
.select select option{background:#0a1d4a;color:var(--ink)}
.ship small{color:var(--ink-dim);font-size:.75rem}
.num input[readonly]{color:var(--sky);background:rgba(3,10,30,.3)}
.badge{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:99px;font-size:.6875rem;color:var(--warn);border:1px solid rgba(255,196,107,.4)}

/* ---- risultati ---- */
.hero{display:flex;align-items:baseline;gap:8px;margin-bottom:14px}
.hero b{font-size:2.5rem;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1}
.hero span{color:var(--ink-dim)}
.metrics{display:grid;gap:8px}
.m{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:rgba(3,10,30,.45);border:1px solid var(--panel-line)}
.m small{display:block;color:var(--ink-dim);font-size:.75rem}
.m strong{font-variant-numeric:tabular-nums;font-size:1.0625rem;white-space:nowrap}
.m .dir{font-size:.75rem;font-weight:500;color:var(--sky);margin-left:6px}
.m.na strong{color:rgba(157,180,224,.45)}
.reveal{animation:rise .28s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---- pulsanti ---- */
.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px}
button{
  height:48px;border-radius:14px;font:600 .9375rem system-ui,sans-serif;cursor:pointer;
  border:1px solid var(--panel-line);color:var(--ink);background:transparent;
  transition:transform .16s var(--ease),background-color .16s var(--ease),border-color .16s var(--ease);
}
button:active{transform:scale(.97)}
button.primary{background:linear-gradient(180deg,var(--blue),var(--blue-deep));border-color:transparent}
button.danger.armed{background:#7a1f2d;border-color:transparent}
.status{text-align:center;color:var(--ink-dim);font-size:.75rem;margin:0}
@media (hover:hover){button:hover{background-color:rgba(255,255,255,.06)}button.primary:hover{filter:brightness(1.1);background-color:transparent}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>Letture immersioni</h1>
      <p class="sub">Waterplane · metri</p>
    </div>
    <div class="progress" id="progress">0/7</div>
  </header>

  <section class="card">
    <label class="ship">
      <span>Numero di costruzione <b class="badge" id="demo" hidden>prova</b></span>
      <div class="select"><select id="ship"><option value="">Seleziona…</option></select></div>
      <small id="shipinfo">Caricamento navi…</small>
    </label>
  </section>

  <section class="card" aria-label="Marche di immersione">
    <h2>Marche · vista dall'alto</h2>
    <div class="plan" id="plan">
      <svg viewBox="0 0 300 360" aria-hidden="true">
        <defs>
          <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#1f6fe0" stop-opacity=".55"/>
            <stop offset="1" stop-color="#0b3d99" stop-opacity=".25"/>
          </linearGradient>
        </defs>
        <text class="lbl lbl-c" x="150" y="14">Prua</text>
        <text class="lbl lbl-c" x="150" y="354">Poppa</text>
        <line class="cl" x1="150" y1="22" x2="150" y2="338"/>
        <path id="hull" class="hull-fill hull-line"
          d="M150 24 C186 66 208 118 210 170 L210 280 Q210 314 198 326 L102 326 Q90 314 90 280 L90 170 C92 118 114 66 150 24 Z"/>
        <g id="marks"></g>
      </svg>

      <div class="field f-fp" data-k="fp"><label for="fp">PS · prua</label><input id="fp" inputmode="decimal" autocomplete="off" placeholder="0,00"><time></time></div>
      <div class="field f-fs" data-k="fs"><label for="fs">SB · prua</label><input id="fs" inputmode="decimal" autocomplete="off" placeholder="0,00"><time></time></div>
      <div class="field f-mp" data-k="mp"><label for="mp">PS · centro</label><input id="mp" inputmode="decimal" autocomplete="off" placeholder="0,00"><time></time></div>
      <div class="field f-ms" data-k="ms"><label for="ms">SB · centro</label><input id="ms" inputmode="decimal" autocomplete="off" placeholder="0,00"><time></time></div>
      <div class="field f-ap" data-k="ap"><label for="ap">PS · poppa</label><input id="ap" inputmode="decimal" autocomplete="off" placeholder="0,00"><time></time></div>
      <div class="field f-as" data-k="as"><label for="as">SB · poppa</label><input id="as" inputmode="decimal" autocomplete="off" placeholder="0,00"><time></time></div>
      <div class="f-ref" id="refbox"><label for="ref">Marca letta su</label><select id="ref"><option value="">—</option><option value="Skeg">Skeg</option><option value="Timone">Timone</option></select></div>
    </div>
  </section>

  <section class="card">
    <div class="row">
      <label class="num full"><span>Densità acqua (t/m³)</span><input id="dens" inputmode="decimal" autocomplete="off" placeholder="1,025"></label>
    </div>
    <details>
      <summary>Dati geometrici nave</summary>
      <div class="row">
        <label class="num"><span>Larghezza prua (m)</span><input id="bf" inputmode="decimal" readonly placeholder="—"></label>
        <label class="num"><span>Larghezza centro (m)</span><input id="bm" inputmode="decimal" readonly placeholder="—"></label>
        <label class="num"><span>Larghezza poppa (m)</span><input id="ba" inputmode="decimal" readonly placeholder="—"></label>
        <label class="num"><span>Distanza marche prua–poppa (m)</span><input id="len" inputmode="decimal" readonly placeholder="—"></label>
        <p class="hint">Letti dalla scheda Impostazioni del foglio per la costruzione scelta. Per cambiarli modifica il foglio.</p>
      </div>
    </details>
  </section>

  <section class="card" id="results" aria-live="polite">
    <h2>Risultati</h2>
    <div class="hero"><b id="mean">—</b><span>m · immersione media</span></div>
    <div class="metrics" id="metrics"></div>
  </section>

  <div class="actions">
    <button class="primary" id="save">Salva su foglio</button>
    <button class="danger" id="reset">Nuova lettura</button>
  </div>
  <p class="status" id="status">Dati salvati automaticamente su questo telefono.</p>
</main>

<script>
const KEYS=['fp','fs','mp','ms','ap','as'];
const STORE='immersioni-v1';
/* URL dell'app web Google Apps Script (vedi apps-script/LEGGIMI.md). Vuoto = modalità prova. */
const SHEET_URL='https://script.google.com/macros/s/AKfycby_D6mm4Z28MqV4CUE1HOAXUTblkOfd3Xrp2X54WaYWvyOeV1ZKgbouNmeNoFLu_AtJ/exec';
const DEMO_SHIPS=[
  {id:'6302',len:200,bf:20,bm:30,ba:30,bt:12},
  {id:'6303',len:200,bf:20,bm:30,ba:30,bt:12},
  {id:'6371',len:215,bf:22,bm:32,ba:32,bt:14},
  {id:'6378',len:215,bf:22,bm:32,ba:32,bt:14}
];
const $=id=>document.getElementById(id);
let state={};
try{state=JSON.parse(localStorage.getItem(STORE))||{}}catch(e){}
state.v=state.v||{};state.t=state.t||{};state.g=state.g||{};state.queue=state.queue||[];state.log=state.log||[];state.ships=state.ships||[];

const num=s=>{if(s==null||s==='')return NaN;const n=parseFloat(String(s).replace(',','.'));return isFinite(n)?n:NaN};
const fmt=(n,d=2)=>isFinite(n)?n.toFixed(d).replace('.',','):'—';
const deg=r=>r*180/Math.PI;
const save=()=>{try{localStorage.setItem(STORE,JSON.stringify(state))}catch(e){}};
const hhmm=ts=>new Date(ts).toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});

/* punti marca sullo scafo + linee guida */
(function drawMarks(){
  const path=$('hull'),L=path.getTotalLength(),pts=[];
  for(let i=0;i<=400;i++)pts.push(path.getPointAtLength(L*i/400));
  const at=(y,side)=>pts.filter(p=>side<0?p.x<150:p.x>150).reduce((a,b)=>Math.abs(b.y-y)<Math.abs(a.y-y)?b:a);
  let h='';
  [[25,'f'],[51,'m'],[79,'a']].forEach(([pc,_])=>{
    const y=pc/100*360;
    const l=at(y,-1),r=at(y,1);
    h+=`<line class="station" x1="${l.x}" y1="${l.y}" x2="${r.x}" y2="${r.y}"/>`;
    h+=`<line class="lead" x1="80" y1="${y}" x2="${l.x}" y2="${l.y}"/><line class="lead" x1="220" y1="${y}" x2="${r.x}" y2="${r.y}"/>`;
    h+=`<circle class="dot" cx="${l.x}" cy="${l.y}" r="4.5"/><circle class="dot" cx="${r.x}" cy="${r.y}" r="4.5"/>`;
  });
  $('marks').innerHTML=h;
})();

/* inizializza campi */
KEYS.forEach(k=>{
  const el=$(k),box=el.closest('.field');
  if(state.v[k]!=null)el.value=state.v[k];
  el.addEventListener('input',()=>{
    const raw=el.value.trim();
    state.v[k]=raw;
    if(isFinite(num(raw))){state.t[k]=state.t[k]||Date.now()}else{delete state.t[k]}
    save();update();
  });
});
['dens','bf','bm','ba','len'].forEach(key=>{
  const el=$(key);if(state.g[key]!=null)el.value=state.g[key];
  if(key==='dens')el.addEventListener('input',()=>{state.g[key]=el.value.trim();save();update()});
});
if(!$('dens').value){$('dens').value='1,025';state.g.dens='1,025'}

function section(p,s,B){
  if(!isFinite(p)||!isFinite(s))return null;
  const mean=(p+s)/2;
  const a=isFinite(B)&&B>0?deg(Math.atan((s-p)/B)):NaN;
  return {mean,diff:s-p,angle:a};
}
const dirHeel=a=>!isFinite(a)||Math.abs(a)<0.005?'':a>0?'a dritta':'a sinistra';

function calc(){
  const v=Object.fromEntries(KEYS.map(k=>[k,num(state.v[k])]));
  const all=KEYS.filter(k=>isFinite(v[k]));
  const mean=all.length?all.reduce((a,k)=>a+v[k],0)/all.length:NaN;
  const B={f:num(state.g.bf),m:num(state.g.bm),a:num(state.g.ba)},len=num(state.g.len);
  const sec={f:section(v.fp,v.fs,B.f),m:section(v.mp,v.ms,B.m),a:section(v.ap,v.as,B.a)};
  let trim=NaN,trimAng=NaN;
  if(sec.f&&sec.a){trim=sec.f.mean-sec.a.mean;if(isFinite(len)&&len>0)trimAng=deg(Math.atan(trim/len))}
  return {v,count:all.length,mean,sec,trim,trimAng};
}

function update(){
  const c=calc(),{sec}=c;
  const filled=c.count+(isFinite(num($('dens').value))?1:0);
  $('progress').textContent=filled+'/7';
  KEYS.forEach(k=>{
    const box=$(k).closest('.field');
    box.classList.toggle('done',!!state.t[k]);
    box.querySelector('time').textContent=state.t[k]?hhmm(state.t[k]):'';
  });
  $('refbox').classList.toggle('done',!!state.ref);
  $('mean').textContent=c.count?fmt(c.mean,3):'—';

  const rows=[];
  [['f','Prua'],['m','Centro'],['a','Poppa']].forEach(([k,n])=>{
    const s=sec[k];
    if(!s){rows.push([`Sbandamento ${n}`,'—','',true]);return}
    const val=isFinite(s.angle)?`${fmt(Math.abs(s.angle))}°`:`Δ ${fmt(s.diff)} m`;
    rows.push([`Sbandamento ${n}`,val,dirHeel(isFinite(s.angle)?s.angle:s.diff),false,`media ${fmt(s.mean,3)} m · SB−PS ${fmt(s.diff)} m`]);
  });
  if(sec.f&&sec.a){
    const where=Math.abs(c.trim)<0.005?'':c.trim>0?'appruato':'appoppato';
    rows.push(['Assetto longitudinale',isFinite(c.trimAng)?`${fmt(Math.abs(c.trimAng),3)}°`:`Δ ${fmt(Math.abs(c.trim))} m`,where,false,`prua ${fmt(sec.f.mean,3)} − poppa ${fmt(sec.a.mean,3)} = ${fmt(c.trim)} m`]);
  }else rows.push(['Assetto longitudinale','—','',true]);

  $('metrics').innerHTML=rows.map(([t,val,d,na,sub])=>
    `<div class="m ${na?'na':'reveal'}"><div><span>${t}</span>${sub?`<small>${sub}</small>`:''}</div><strong>${val}${d?`<span class="dir">${d}</span>`:''}</strong></div>`).join('');
}

/* ---- navi dal foglio (scheda Impostazioni) ---- */
/* larghezza di poppa: skeg (colonna E) o timone (colonna F) a seconda del riferimento scelto */
function applyShip(id){
  const sh=state.ships.find(x=>x.id===id);
  state.ship=sh?sh.id:'';
  const c=v=>isFinite(v)?String(v).replace('.',','):'';
  const bAft=sh?(state.ref==='Timone'&&isFinite(sh.bt)?sh.bt:sh.ba):NaN;
  state.g.bf=sh?c(sh.bf):'';state.g.bm=sh?c(sh.bm):'';state.g.ba=c(bAft);state.g.len=sh?c(sh.len):'';
  ['bf','bm','ba','len'].forEach(k=>$(k).value=state.g[k]);
  $('shipinfo').textContent=sh?`Distanza marche ${fmt(sh.len,1)} m · larghezze ${fmt(sh.bf,1)} / ${fmt(sh.bm,1)} / ${fmt(bAft,1)} m (poppa ${state.ref==='Timone'?'timone':'skeg'})`:'Scegli la nave su cui stai leggendo.';
  save();update();
}
function fillShips(){
  const sel=$('ship');
  sel.innerHTML='<option value="">Seleziona…</option>'+state.ships.map(x=>`<option value="${x.id}">${x.id}</option>`).join('');
  sel.value=state.ship||'';
  applyShip(sel.value);
}
async function loadShips(){
  if(!SHEET_URL){
    $('demo').hidden=false;state.ships=DEMO_SHIPS;fillShips();return;
  }
  try{
    const r=await fetch(SHEET_URL+'?action=navi',{cache:'no-store'});
    const j=await r.json();
    if(!j.ok)throw new Error(j.error||'risposta non valida');
    state.ships=j.navi;save();
  }catch(e){
    $('shipinfo').textContent=state.ships.length?'Offline: uso l\'ultimo elenco navi scaricato.':'Impossibile leggere le navi dal foglio.';
    if(!state.ships.length)return;
  }
  fillShips();
}
$('ship').addEventListener('change',e=>applyShip(e.target.value));
$('ref').value=state.ref||'';
$('ref').addEventListener('change',e=>{state.ref=e.target.value;applyShip(state.ship)});

/* ---- salvataggio ---- */
const rid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const tsr=k=>state.t[k]||null;
async function flush(){
  if(!SHEET_URL||!state.queue.length||flush.busy)return;
  flush.busy=true;
  try{
    while(state.queue.length){
      const rec=state.queue[0];
      const r=await fetch(SHEET_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'salva',record:rec})});
      const j=await r.json();
      if(!j.ok)throw new Error(j.error||'errore foglio');
      state.queue.shift();save();
    }
    setStatus('Salvato su foglio ✓ '+hhmm(Date.now()));
  }catch(e){
    setStatus(`${state.queue.length} lettura/e in attesa: invio appena c'è connessione.`);
  }finally{flush.busy=false}
}
const setStatus=t=>$('status').textContent=t;

$('save').addEventListener('click',()=>{
  const c=calc();
  if(!state.ship){setStatus('Scegli prima il numero di costruzione.');$('ship').focus();return}
  if(!state.ref){setStatus('Indica se la marca di poppa è letta su skeg o timone.');$('ref').focus();return}
  if(c.count<6){setStatus(`Mancano ${6-c.count} marche: completa le letture prima di salvare.`);return}
  const times=Object.values(state.t);
  const rec={
    rid:rid(),ts:Date.now(),costruzione:state.ship,rif_poppa:state.ref,
    marche:Object.fromEntries(KEYS.map(k=>[k,c.v[k]])),
    densita:num($('dens').value)||null,
    media:c.mean,
    sbandamento:{f:c.sec.f.angle,m:c.sec.m.angle,a:c.sec.a.angle},
    assetto_gradi:c.trimAng,assetto_m:c.trim,
    prima_lettura:times.length?Math.min(...times):null,ultima_lettura:times.length?Math.max(...times):null
  };
  state.queue.push(rec);state.log.push(rec);
  state.v={};state.t={};state.ref='';$('ref').value='';save();KEYS.forEach(k=>$(k).value='');update();
  if(SHEET_URL){setStatus('Salvataggio in corso…');flush()}
  else setStatus(`Modalità prova: record ${state.ship} salvato solo su questo telefono (${state.log.length}).`);
  if(!SHEET_URL){state.queue=[];save()}
});

/* azioni */
let armed=0;
$('reset').addEventListener('click',e=>{
  const b=e.currentTarget;
  if(!armed){armed=setTimeout(()=>{armed=0;b.classList.remove('armed');b.textContent='Nuova lettura'},3000);b.classList.add('armed');b.textContent='Tocca ancora per cancellare';return}
  clearTimeout(armed);armed=0;b.classList.remove('armed');b.textContent='Nuova lettura';
  state.v={};state.t={};state.ref='';$('ref').value='';save();KEYS.forEach(k=>$(k).value='');update();
});
update();
loadShips();
flush();
addEventListener('online',flush);
</script>
</body>
</html>
